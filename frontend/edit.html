<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>Editar Usuário - CRUD</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">

	<link rel="stylesheet" href="assets/css/global.css">
	<link rel="stylesheet" href="assets/css/fonts.css">
	<link rel="stylesheet" href="assets/css/edit.css">

	<script src="node_modules/jquery/dist/jquery.min.js" defer></script>
	<script src="assets/js/global.js" defer></script>
	<script src="assets/js/edit.js" defer></script>
</head>

<body>
	<aside id="navegacaoLateral">
		<label class="hamburger">
			<input type="checkbox">
			<svg viewBox="0 0 32 32">
				<path class="line line-top-bottom"
					d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22">
				</path>
				<path class="line" d="M7 16 27 16"></path>
			</svg>
		</label>
		<nav>
			<ul class="lista-navegacao">
				<li>
					<a href="index.html" class="link-atalho">
						<span class="material-symbols-rounded">person</span>
						<h3>Usuários</h3>
					</a>
				</li>
				<li>
					<a href="pages.html">
						<span class="material-symbols-rounded">auto_stories</span>
						<h3>Páginas</h3>
					</a>
				</li>
			</ul>
		</nav>
		<div class="container-usuario">
			<div id="avatarLogado" class="avatar">D</div>
		</div>
	</aside>
	<main class="container-edicao">
		<a href="" class="botao-voltar">
			<div class="sign"><span class="material-symbols-rounded">chevron_left</span></div>
			<div class="text">Cancelar</div>
		</a>

		<div id="detalhesUsuario" class="cartao-usuario">
			<div class="cabecalho-usuario">
				<div class="informacoes-usuario">
					<div id="avatar" class="avatar"></div>
					<div class="secao-nome">
						<h1 id="nomeUsuario" class="nome-usuario"></h1>
						<span id="distintivo-status" class="distintivo-status"></span>
					</div>
				</div>
			</div>

			<form id="formulario-edicao" class="conteudo-usuario">
				<div class="secao-dados-usuario">
					<h2 class="titulo-secao">Editar Dados do Usuário</h2>
					<div class="grade-dados">
						<div class="campo-formulario">
							<label for="idUsuario" class="etiqueta-dados">ID</label>
							<input id="idUsuario" class="entrada-id" type="text" readonly>
						</div>
						<div class="campo-formulario">
							<label for="nomeUsuarioEntrada" class="etiqueta-dados">NOME</label>
							<input id="nomeUsuarioEntrada" class="entrada-texto" type="text" required>
						</div>
						<div class="campo-formulario">
							<label for="emailUsuario" class="etiqueta-dados">EMAIL</label>
							<input id="emailUsuario" class="entrada-texto" type="email" required>
						</div>
						<div class="campo-formulario">
							<label for="funcao" class="etiqueta-dados">FUNÇÃO</label>
							<select id="funcao" class="entrada-select" required>
								<option value="usuario">Usuário</option>
								<option value="administrador">Administrador</option>
								<option value="moderador">Moderador</option>
							</select>
						</div>
					</div>
				</div>

				<div class="secao-status">
					<h2 class="titulo-secao">Status</h2>
					<div class="container-alternancia">
						<label class="etiqueta-alternancia">
							<input id="statusAlternancia" type="checkbox" class="entrada-alternancia">
							<span class="texto-alternancia">
								<span id="textoStatus" class="estado-alternancia">Ativo</span>
							</span>
						</label>
					</div>
				</div>

				<div class="secao-acoes">
					<button type="submit" id="botaoSalvar">
						<div class="svg-wrapper-1">
							<div class="svg-wrapper">
								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"
									class="icon">
									<path
										d="M22,15.04C22,17.23 20.24,19 18.07,19H5.93C3.76,19 2,17.23 2,15.04C2,13.07 3.43,11.44 5.31,11.14C5.28,11 5.27,10.86 5.27,10.71C5.27,9.33 6.38,8.2 7.76,8.2C8.37,8.2 8.94,8.43 9.37,8.8C10.14,7.05 11.13,5.44 13.91,5.44C17.28,5.44 18.87,8.06 18.87,10.83C18.87,10.94 18.87,11.06 18.86,11.17C20.65,11.54 22,13.13 22,15.04Z">
									</path>
								</svg>
							</div>
						</div>
						<span>Salvar</span>
					</button>
				</div>
			</form>
		</div>
	</main>
</body>

</html>
