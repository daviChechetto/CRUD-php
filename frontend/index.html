<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>CRUD de Usuários</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">

	<link rel="stylesheet" href="assets/css/global.css">
	<link rel="stylesheet" href="assets/css/fonts.css">

	<script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
	<script src="assets/js/global.js" defer></script>
	<script src="assets/js/index.js" defer></script>
</head>

<body>
	<aside id="navegacaoLateral">
		<label class="hamburger">
			<input type="checkbox">
			<svg viewBox="0 0 32 32">
				<path class="line line-top-bottom"
					d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22">
				</path>
				<path class="line" d="M7 16 27 16"></path>
			</svg>
		</label>
		<nav>
			<ul class="lista-navegacao">
				<li>
					<a href="index.html" class="link-atalho">
						<span class="material-symbols-rounded">person</span>
						<h3>Usuários</h3>
					</a>
				</li>
				<li>
					<a href="pages.html">
						<span class="material-symbols-rounded">auto_stories</span>
						<h3>Páginas</h3>
					</a>
				</li>
			</ul>
		</nav>
		<div class="container-usuario">
			<div id="avatarLogado" class="avatar">D</div>
		</div>
	</aside>
	<main>
		<button id="botaoCadastrarUsuario">
			<div class="sign">+</div>
			<div class="text">Cadastrar</div>
		</button>
		<h2>Gerenciamento de Usuários</h2>

		<div id="formularioCadastrarUsuario" class="container-formulario">
			<form id="userForm">
				<h3 class="titulo-formulario">Cadastrar Usuário</h3>

				<input type="hidden" id="userId">

				<div class="form-group">
					<input type="text" id="nome" class="campo-texto" required autocomplete="name">
					<label for="nome" class="user-label">Nome:</label>
				</div>
				<div class="form-group">
					<input type="email" id="apelido" class="campo-texto" required autocomplete="email">
					<label for="apelido" class="user-label">E-mail (username):</label>
				</div>
				<div class="form-group">
					<input type="password" id="senha" class="campo-texto" required autocomplete="new-password">
					<label for="senha" class="user-label">Senha:</label>
				</div>
				<div class="form-group">
					<div class="toggle-container">
						<input id="check" type="checkbox" />
						<label class="switch" for="check">
							<svg viewBox="0 0 212.4992 84.4688" overflow="visible">
								<path pathLength="360" fill="none" stroke="currentColor"
									d="M 42.2496 0 A 42.24 42.24 90 0 0 0 42.2496 A 42.24 42.24 90 0 0 42.2496 84.4688 A 42.24 42.24 90 0 0 84.4992 42.2496 A 42.24 42.24 90 0 0 42.2496 0 A 42.24 42.24 90 0 0 0 42.2496 A 42.24 42.24 90 0 0 42.2496 84.4688 L 170.2496 84.4688 A 42.24 42.24 90 0 0 212.4992 42.2496 A 42.24 42.24 90 0 0 170.2496 0 A 42.24 42.24 90 0 0 128 42.2496 A 42.24 42.24 90 0 0 170.2496 84.4688 A 42.24 42.24 90 0 0 212.4992 42.2496 A 42.24 42.24 90 0 0 170.2496 0 L 42.2496 0">
								</path>
								<path pathLength="360" style="scale: 1 -1;" fill="none" stroke="currentColor"
									d="M 42.2496 0 A 42.24 42.24 90 0 0 0 42.2496 A 42.24 42.24 90 0 0 42.2496 84.4688 A 42.24 42.24 90 0 0 84.4992 42.2496 A 42.24 42.24 90 0 0 42.2496 0 A 42.24 42.24 90 0 0 0 42.2496 A 42.24 42.24 90 0 0 42.2496 84.4688 L 170.2496 84.4688 A 42.24 42.24 90 0 0 212.4992 42.2496 A 42.24 42.24 90 0 0 170.2496 0 A 42.24 42.24 90 0 0 128 42.2496 A 42.24 42.24 90 0 0 170.2496 84.4688 A 42.24 42.24 90 0 0 212.4992 42.2496 A 42.24 42.24 90 0 0 170.2496 0 L 42.2496 0">
								</path>
							</svg>
						</label>
					</div>
				</div>

				<!-- From Uiverse.io by Peary74 -->
				<button type="submit" id="botaoSalvar">
					<div class="svg-wrapper-1">
						<div class="svg-wrapper">
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"
								class="icon">
								<path
									d="M22,15.04C22,17.23 20.24,19 18.07,19H5.93C3.76,19 2,17.23 2,15.04C2,13.07 3.43,11.44 5.31,11.14C5.28,11 5.27,10.86 5.27,10.71C5.27,9.33 6.38,8.2 7.76,8.2C8.37,8.2 8.94,8.43 9.37,8.8C10.14,7.05 11.13,5.44 13.91,5.44C17.28,5.44 18.87,8.06 18.87,10.83C18.87,10.94 18.87,11.06 18.86,11.17C20.65,11.54 22,13.13 22,15.04Z">
								</path>
							</svg>
						</div>
					</div>
					<span>Salvar</span>
				</button>

				<button type="button" id="btnCancel" style="display:none;">Cancelar Edição</button>
			</form>
		</div>

		<h3>Lista de Usuários</h3>
		<section id="usersTable">
			<ul class="table-header">
				<li>ID</li>
				<li>Nome</li>
				<li>E-mail</li>
				<li>Status</li>
			</ul>
			<div id="corpoTabela">
			</div>
		</section>

		<!-- From Uiverse.io by andrew-demchenk0 -->
		<button id="botaoRefresh" type="button" class="button">
			<span class="button__text">Refresh</span>
			<span class="button__icon">
				<svg class="svg" height="48" viewBox="0 0 48 48" width="48" xmlns="http://www.w3.org/2000/svg">
					<path
						d="M35.3 12.7c-2.89-2.9-6.88-4.7-11.3-4.7-8.84 0-15.98 7.16-15.98 16s7.14 16 15.98 16c7.45 0 13.69-5.1 15.46-12h-4.16c-1.65 4.66-6.07 8-11.3 8-6.63 0-12-5.37-12-12s5.37-12 12-12c3.31 0 6.28 1.38 8.45 3.55l-6.45 6.45h14v-14l-4.7 4.7z">
					</path>
					<path d="M0 0h48v48h-48z" fill="none"></path>
				</svg>
			</span>
		</button>
	</main>
</body>

</html>
