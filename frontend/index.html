<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>CRUD de Usuários</title>

	<link rel="stylesheet" href="css/global.css">
	<link rel="stylesheet" href="css/fonts.css">

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="js/global.js" defer></script>
</head>

<body>
	<h1>Gerenciamento de Usuários</h1>

	<div class="container-formulario">
		<h2 id="formTitle">Cadastrar Usuário</h2>
		<form id="userForm">
			<input type="hidden" id="userId">

			<div class="form-group">
				<input type="text" id="name" class="input" required>
				<label for="name" class="user-label">Nome:</label>
			</div>
			<div class="form-group">
				<input type="email" id="username" class="input" required>
				<label for="username" class="user-label">E-mail (username):</label>
			</div>
			<div class="form-group">
				<input type="password" id="password" class="input" required>
				<label for="password" class="user-label">Senha:</label>
			</div>
			<div class="form-group">
				<input type="number" id="status" class="input" value="1" min="0" max="1" required>
				<label for="status" class="user-label">Status (1 ou 0):</label>
			</div>

			<!-- From Uiverse.io by Peary74 -->
			<button type="submit" id="btnSave">
				<div class="svg-wrapper-1">
					<div class="svg-wrapper">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30" class="icon">
							<path
								d="M22,15.04C22,17.23 20.24,19 18.07,19H5.93C3.76,19 2,17.23 2,15.04C2,13.07 3.43,11.44 5.31,11.14C5.28,11 5.27,10.86 5.27,10.71C5.27,9.33 6.38,8.2 7.76,8.2C8.37,8.2 8.94,8.43 9.37,8.8C10.14,7.05 11.13,5.44 13.91,5.44C17.28,5.44 18.87,8.06 18.87,10.83C18.87,10.94 18.87,11.06 18.86,11.17C20.65,11.54 22,13.13 22,15.04Z">
							</path>
						</svg>
					</div>
				</div>
				<span>Save</span>
			</button>

			<button type="button" id="btnCancel" style="display:none;">Cancelar Edição</button>
		</form>
	</div>

	<h2>Lista de Usuários</h2>
	<table id="usersTable">
		<thead>
			<tr>
				<th>ID</th>
				<th>Nome</th>
				<th>E-mail</th>
				<th>Status</th>
				<th>Ações</th>
			</tr>
		</thead>
		<tbody id="tableBody">
		</tbody>
	</table>

</body>

</html>
