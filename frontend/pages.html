<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>CRUD de Usuários</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">

	<link rel="stylesheet" href="assets/css/global.css">
	<link rel="stylesheet" href="assets/css/fonts.css">

	<script src="node_modules/jquery/dist/jquery.min.js" defer></script>
	<script src="assets/js/global.js" defer></script>
</head>

<body>
	<aside id="navegacaoLateral">
		<label class="hamburger">
			<input type="checkbox">
			<svg viewBox="0 0 32 32">
				<path class="line line-top-bottom"
					d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22">
				</path>
				<path class="line" d="M7 16 27 16"></path>
			</svg>
		</label>
		<nav>
			<ul class="lista-navegacao">
				<li>
					<a href="index.html" class="link-atalho">
						<span class="material-symbols-rounded">person</span>
						<h3>Usuários</h3>
					</a>
				</li>
				<li>
					<a href="pages.html">
						<span class="material-symbols-rounded">auto_stories</span>
						<h3>Páginas</h3>
					</a>
				</li>
			</ul>
		</nav>
		<div class="container-usuario">
			<div id="avatarLogado" class="avatar">D</div>
		</div>
	</aside>
	<main>
		<section class="container-construtor">
			<div class="construtor-cabecalho">
				<input type="text" id="pageTitle" placeholder="Digite o título da página..." required>
				<button id="btnSalvarPagina" class="animated-button">Salvar Página</button>
			</div>

			<div class="construtor-estrutura">
				<aside class="barra-de-ferramentas">
					<h3>Blocos</h3>
					<button class="botao-adicionar-bloco" data-type="paragrafo">
						<span class="material-symbols-rounded">notes</span> Parágrafo
					</button>
					<button class="botao-adicionar-bloco" data-type="imagem">
						<span class="material-symbols-rounded">image</span> Imagem
					</button>
					<button class="botao-adicionar-bloco" data-type="lista">
						<span class="material-symbols-rounded">format_list_bulleted</span> Lista
					</button>
				</aside>

				<main id="construtorCanva" class="area-canva">
					<div class="empty-state">
						<p>Clique em um bloco ao lado para começar a construir sua página.</p>
					</div>
				</main>
			</div>
		</section>
	</main>
</body>

</html>
