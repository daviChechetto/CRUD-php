<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>Gerenciamento de Páginas</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">

	<link rel="stylesheet" href="assets/css/global.css">
	<link rel="stylesheet" href="assets/css/index-pages.css">
	<link rel="stylesheet" href="assets/css/fonts.css">
    
	<script src="node_modules/jquery/dist/jquery.min.js" defer></script>
	<script src="assets/js/global.js" defer></script>
	<script src="assets/js/index-pages.js" defer></script>
</head>

<body>
	<aside id="navegacaoLateral">
		<label class="hamburger">
			<input type="checkbox">
			<svg viewBox="0 0 32 32">
				<path class="line line-top-bottom"
					d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22">
				</path>
				<path class="line" d="M7 16 27 16"></path>
			</svg>
		</label>
		<nav>
			<ul class="lista-navegacao"></ul>
		</nav>
		<a href="/perfil" id="ligacaoPerfilUsuario" class="container-usuario">
        </a>
	</aside>
	<main>
		<!-- From Uiverse.io by andrew-demchenk0 -->
		<button id="botaoRefresh" type="button" class="button">
			<span class="button__text">Refresh</span>
			<span class="button__icon">
				<svg class="svg" height="48" viewBox="0 0 48 48" width="48" xmlns="http://www.w3.org/2000/svg">
					<path
						d="M35.3 12.7c-2.89-2.9-6.88-4.7-11.3-4.7-8.84 0-15.98 7.16-15.98 16s7.14 16 15.98 16c7.45 0 13.69-5.1 15.46-12h-4.16c-1.65 4.66-6.07 8-11.3 8-6.63 0-12-5.37-12-12s5.37-12 12-12c3.31 0 6.28 1.38 8.45 3.55l-6.45 6.45h14v-14l-4.7 4.7z">
					</path>
					<path d="M0 0h48v48h-48z" fill="none"></path>
				</svg>
			</span>
		</button>
		
		<h2>Gerenciamento de Páginas</h2>

		<h3>Lista de Páginas</h3>
		<section id="tabelaPaginas">
			<ul class="tabela-cabecalho">
				<li>Título</li>
				<li>Status</li>
				<li>Última modificação</li>
				<li>Blocos</li>
			</ul>
			<div id="tabelaPaginasCorpo">
			</div>
		</section>

		<a id="linkCriarPagina" href="/paginas/nova-pagina">
			<div class="sign">+</div>
			<div class="text">Criar Página</div>
		</a>
	</main>
</body>

</html>
